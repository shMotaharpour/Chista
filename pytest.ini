[pytest]
# `epic` runs the whole system: the master's LP, its rounding, the day search, and wsr's
# verdict on the committed day. That is a minute per test, not a second, so it is opt-in:
# the default run leaves it out and `pytest -m epic` is how you ask for it. Structural
# guards - the ones that can fail for one reason - stay in the default run.
markers =
    epic: end-to-end across the master, the day search and wsr; opt-in
addopts = -m "not epic"
